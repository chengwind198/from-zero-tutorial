<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root {
  --bg: #b81c22;
  --ink: #f7e9c8;
  --gold: #f5d795;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
}
html { background: var(--bg); }
body {
  font-family: "Kaiti SC", "KaiTi", "STKaiti", "Noto Serif SC", serif;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 90% 85%, rgba(224,183,106,0.16) 0 180px, transparent 181px),
    repeating-linear-gradient(45deg, rgba(224,183,106,0.05) 0 2px, transparent 2px 14px);
  color: var(--ink);
  border: 2px solid var(--gold);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 44px 52px;
  overflow: hidden;
}
body::before,
body::after {
  content: "";
  position: absolute;
  width: 44px;
  height: 44px;
  border: 2px solid var(--gold);
}
body::before { left: 10px; top: 10px; border-right: none; border-bottom: none; }
body::after { right: 10px; bottom: 10px; border-left: none; border-top: none; }
.top {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 3px;
}
.lesson {
  border: 1px solid var(--gold);
  color: var(--ink);
  padding: 3px 12px;
  letter-spacing: 1px;
}
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 40px;
}
h1 {
  writing-mode: vertical-rl;
  font-size: clamp(30px, 5vw, {{TITLE_SIZE}}px);
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: 0.08em;
  overflow-wrap: anywhere;
}
.subtitle {
  margin-right: 24px;
  font-size: clamp(14px, 2vw, 20px);
  color: var(--gold);
  letter-spacing: 2px;
}
.bottom {
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 2px;
}
</style>
</head>
<body>
  <div class="top">
    <span>{{SERIES}}</span>
    <span class="lesson">第 {{LESSON}} 课</span>
    <span>{{CATEGORY}}</span>
  </div>
  <div class="main">
    <div class="subtitle">{{SUBTITLE}}</div>
    <h1>{{TITLE}}</h1>
  </div>
  <div class="bottom">{{FOOTER}}</div>
</body>
</html>
