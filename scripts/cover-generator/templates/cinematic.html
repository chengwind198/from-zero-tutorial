<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#08080a;--ink:#f2f0ec;--sub:#8d867a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Songti SC","SimSun",serif;background-color:var(--bg);background-image:radial-gradient(circle at 50% 38%,rgba(242,240,236,.05) 0 180px,transparent 240px);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:44px 54px;overflow:hidden}
.top{text-align:center;font-size:13px;color:var(--sub);letter-spacing:4px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center}
h1{font-size:clamp(30px,5.4vw,{{TITLE_SIZE}}px);line-height:1.3;font-weight:400;letter-spacing:.18em;overflow-wrap:anywhere}
.subtitle{font-size:clamp(14px,2vw,20px);color:var(--sub);letter-spacing:.2em}
.credits{font-family:"Courier New",monospace;font-size:10px;line-height:1.8;color:var(--sub);text-align:center;letter-spacing:1px;text-transform:uppercase;transform:scaleX(.9)}
.bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
</style></head><body>
<div class="top">{{SERIES}}</div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div><div class="credits">第 {{LESSON}} 课 · {{CATEGORY}}</div></div>
<div class="bottom"><span>{{FOOTER}}</span><span>{{DATE}}</span></div>
</body></html>
