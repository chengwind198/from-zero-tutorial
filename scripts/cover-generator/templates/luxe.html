<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#0a0a0a;--ink:#f0ece4;--metal:#b08d57;--line:rgba(240,236,228,.22)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Songti SC","SimSun",serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:52px 64px;overflow:hidden}
.top{display:flex;justify-content:center;font-size:13px;color:var(--metal);letter-spacing:6px;text-transform:uppercase}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
h1{font-size:clamp(28px,5vw,{{TITLE_SIZE}}px);line-height:1.3;font-weight:300;letter-spacing:.26em;color:var(--ink);overflow-wrap:anywhere}
.metal-line{width:120px;height:1px;background:var(--metal)}
.subtitle{font-size:clamp(13px,1.8vw,18px);color:var(--metal);letter-spacing:.3em}
.bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--metal);letter-spacing:4px;border-top:1px solid var(--line);padding-top:14px}
</style></head><body>
<div class="top">{{SERIES}}</div>
<div class="main"><h1>{{TITLE}}</h1><div class="metal-line"></div><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom"><span>第 {{LESSON}} 课</span><span>{{CATEGORY}}</span><span>{{FOOTER}}</span></div>
</body></html>
