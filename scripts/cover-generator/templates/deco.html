<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#0f1c18;--ink:#f5efe3;--gold:#d9b26a;--line:rgba(217,178,106,.45)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Songti SC","SimSun",serif;background-color:var(--bg);background-image:repeating-conic-gradient(from 0deg at 50% 0%,rgba(217,178,106,.10) 0deg 8deg,transparent 8deg 16deg);color:var(--ink);border:2px solid var(--gold);display:flex;flex-direction:column;justify-content:space-between;padding:42px 52px;overflow:hidden}
.top{display:flex;gap:14px;font-size:14px;color:var(--gold);letter-spacing:4px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;align-items:center}
h1{font-size:clamp(30px,5.4vw,{{TITLE_SIZE}}px);line-height:1.2;font-weight:400;letter-spacing:.12em;overflow-wrap:anywhere}
.subtitle{font-size:clamp(14px,2vw,20px);color:var(--gold);letter-spacing:.2em}
.bottom{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--gold);letter-spacing:3px}
</style></head><body>
<div class="top"><span>{{SERIES}}</span><span>第 {{LESSON}} 课</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom"><span>{{FOOTER}}</span><span>{{CATEGORY}}</span></div>
</body></html>
