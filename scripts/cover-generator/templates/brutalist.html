<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#ffffff;--ink:#000000;--accent:#ff3b00}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Times New Roman","SimSun",serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:36px 44px;overflow:hidden;border:4px solid var(--ink)}
.top{display:flex;gap:12px;font-size:15px;font-weight:700;border:3px solid var(--ink);padding:8px 14px;background:var(--ink);color:var(--bg);transform:rotate(-1deg)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
h1{font-size:clamp(34px,6.4vw,{{TITLE_SIZE}}px);line-height:1.05;font-weight:700;overflow-wrap:anywhere;text-decoration:underline}
.subtitle{font-size:clamp(16px,2.4vw,24px);color:var(--accent);font-weight:700}
.bottom{display:flex;justify-content:space-between;border:3px solid var(--ink);padding:8px 12px;font-size:13px;font-weight:700;transform:rotate(1deg)}
</style></head><body>
<div class="top"><span>{{SERIES}}</span><span>第 {{LESSON}} 课</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom"><span>{{FOOTER}}</span><span>{{CATEGORY}}</span></div>
</body></html>
