<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#f4f1e6;--ink:#2b3327;--line:#b9b49e;--leaf:#5c6b4f;--label:#faf8f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Songti SC","SimSun",serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:42px 52px;overflow:hidden;position:relative}
body::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);letter-spacing:2px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-right:190px}
h1{font-size:clamp(30px,5.6vw,{{TITLE_SIZE}}px);line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.latin{font-style:italic;font-size:15px;color:var(--leaf)}
.subtitle{font-size:clamp(14px,2vw,20px);color:var(--ink);opacity:.8}
.plant{position:absolute;right:56px;bottom:90px;width:2px;height:220px;background:var(--leaf)}
.plant::before,.plant::after{content:"";position:absolute;width:70px;height:2px;background:var(--leaf)}
.plant::before{left:0;top:50px;transform:rotate(-28deg)}
.plant::after{right:0;top:110px;transform:rotate(28deg)}
.label{border:1px solid var(--line);background:var(--label);padding:6px 14px;font-size:11px;color:var(--ink);letter-spacing:1px;align-self:flex-end}
.bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--ink)}
</style></head><body>
<div class="top"><span>{{SERIES}}</span><span>FIG. {{LESSON}}</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="latin">Series: {{CATEGORY}}</div><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="plant"></div>
<div class="label">{{FOOTER}}</div>
</body></html>
