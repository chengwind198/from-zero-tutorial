<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:linear-gradient(150deg,#bcd2ff,#e3ccff 42%,#ffc9e8);--ink:#3a3f66}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:#e3ccff}
body{font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:42px 52px;overflow:hidden;position:relative}
.star{position:absolute;width:34px;height:34px;background:var(--ink);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:.55}
.s1{right:90px;top:60px}.s2{right:220px;top:150px;transform:scale(.6)}.s3{right:140px;bottom:80px;transform:scale(.8)}
.top{display:flex;gap:12px;font-size:14px;color:var(--ink);letter-spacing:2px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
h1{font-size:clamp(30px,5.6vw,{{TITLE_SIZE}}px);line-height:1.2;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#fff 0%,#cdd9ff 22%,#7f8fd4 44%,#fff 50%,#c9d3ff 78%,#eef2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 rgba(255,255,255,.7));overflow-wrap:anywhere}
.subtitle{font-size:clamp(15px,2.2vw,22px);color:var(--ink)}
.bottom{font-size:13px;color:var(--ink);opacity:.8;border-top:2px solid rgba(58,63,102,.25);padding-top:10px}
</style></head><body>
<div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
<div class="top"><span>{{SERIES}}</span><span>第 {{LESSON}} 课</span><span>{{CATEGORY}}</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom">{{FOOTER}}</div>
</body></html>
