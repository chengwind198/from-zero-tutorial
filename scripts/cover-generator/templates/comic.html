<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#ffd93d;--ink:#111;--red:#ff2e4c;--paper:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Impact","Arial Black","Microsoft YaHei",sans-serif;background-color:var(--bg);background-image:radial-gradient(rgba(17,17,17,.18) 0 1.5px,transparent 1.5px);background-size:11px 11px;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:40px 48px;overflow:hidden}
.top{display:flex;gap:12px;font-size:15px;font-weight:700}
.top span{background:var(--paper);border:3px solid var(--ink);padding:3px 12px;transform:rotate(-1deg)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
h1{font-size:clamp(32px,6.2vw,{{TITLE_SIZE}}px);line-height:1.1;font-weight:900;color:var(--paper);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);overflow-wrap:anywhere}
.subtitle{font-size:clamp(16px,2.4vw,24px);color:var(--red);font-weight:700;-webkit-text-stroke:1px var(--ink)}
.burst{position:absolute;right:60px;top:100px;width:90px;height:90px;background:var(--red);clip-path:polygon(50% 0,58% 38%,100% 30%,68% 54%,82% 100%,50% 68%,18% 100%,32% 54%,0 30%,42% 38%);display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:900;font-size:16px;transform:rotate(8deg)}
.bottom{font-size:14px;background:var(--ink);color:var(--paper);padding:6px 14px;align-self:flex-start}
</style></head><body>
<div class="burst">{{LESSON}}</div>
<div class="top"><span>{{SERIES}}</span><span>第 {{LESSON}} 课</span><span>{{CATEGORY}}</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom">{{FOOTER}}</div>
</body></html>
