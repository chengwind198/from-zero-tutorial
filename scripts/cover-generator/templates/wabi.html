<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#e9e3d6;--ink:#2b2723;--sub:#625c50;--seal:#b3402f;--line:#cfc7b6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Songti SC","SimSun",serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:48px 60px;overflow:hidden}
.top{font-size:13px;color:var(--sub);letter-spacing:4px}
.main{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:flex-start;gap:20px}
h1{font-size:clamp(28px,5vw,{{TITLE_SIZE}}px);line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.side{writing-mode:vertical-rl;font-size:14px;color:var(--sub);letter-spacing:4px}
.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--sub)}
.seal{width:52px;height:52px;border:2px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;font-size:17px}
</style></head><body>
<div class="top">{{SERIES}}</div>
<div class="main"><div class="side">第 {{LESSON}} 课 · {{CATEGORY}}</div><h1>{{TITLE}}</h1></div>
<div class="bottom"><span>{{FOOTER}}</span><div class="seal">学</div></div>
</body></html>
