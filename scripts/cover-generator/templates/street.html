<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
:root{--bg:#dcd8ce;--paper:#f2efe7;--ink:#141414;--acid:#d6ff3d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:var(--bg)}
body{font-family:"Impact","Arial Black","Microsoft YaHei",sans-serif;background-color:var(--bg);background-image:radial-gradient(rgba(20,20,20,.16) 0 1px,transparent 1px);background-size:3px 3px;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:40px 48px;overflow:hidden}
.sheet{position:absolute;background:var(--paper);border:2px solid var(--ink)}
.sh1{inset:0;clip-path:polygon(0 0,96% 2%,100% 100%,3% 98%)}
.sh2{position:absolute;left:26px;top:20px;right:26px;bottom:20px;background:transparent;border:2px dashed var(--ink);clip-path:polygon(0 0,97% 1%,100% 100%,2% 99%);pointer-events:none}
.top{position:relative;display:flex;gap:12px;font-size:15px}
.top span{background:var(--paper);border:2px solid var(--ink);padding:3px 12px;transform:rotate(-2deg)}
.top span:nth-child(2){transform:rotate(1deg)}
.main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
h1{font-size:clamp(32px,6.2vw,{{TITLE_SIZE}}px);line-height:1.1;font-weight:900;color:var(--ink);background:var(--acid);display:inline-block;padding:4px 16px;transform:rotate(-1.2deg);overflow-wrap:anywhere;align-self:flex-start;box-shadow:6px 6px 0 var(--ink)}
.subtitle{font-size:clamp(16px,2.4vw,24px);color:var(--ink);font-weight:700}
.bottom{position:relative;font-size:14px;font-weight:700;background:var(--paper);border:2px solid var(--ink);padding:6px 14px;transform:rotate(1deg);align-self:flex-end}
</style></head><body>
<div class="sheet sh1"></div><div class="sheet sh2"></div>
<div class="top"><span>{{SERIES}}</span><span>第 {{LESSON}} 课</span><span>{{CATEGORY}}</span></div>
<div class="main"><h1>{{TITLE}}</h1><div class="subtitle">{{SUBTITLE}}</div></div>
<div class="bottom">{{FOOTER}}</div>
</body></html>
