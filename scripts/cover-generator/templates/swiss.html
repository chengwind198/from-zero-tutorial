<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root {
  --bg: #ffffff;
  --ink: #111111;
  --sub: #6b6b6b;
  --accent: #e4002b;
  --line: #dcdcdc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
}
html { background: var(--bg); }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px 48px;
  overflow: hidden;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--sub);
}
.top .meta { display: flex; gap: 16px; }
.lesson { color: var(--accent); font-weight: 700; }
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}
h1 {
  font-size: clamp(32px, 6vw, {{TITLE_SIZE}}px);
  line-height: 1.15;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.rule {
  width: 120px;
  height: 3px;
  background: var(--accent);
}
.subtitle { font-size: clamp(16px, 2.2vw, 22px); color: var(--sub); }
.bottom {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 10px;
  font-size: 13px;
  color: var(--sub);
  letter-spacing: 1px;
}
.no { font-family: "Courier New", monospace; color: var(--ink); }
</style>
</head>
<body>
  <div class="top">
    <div class="meta">
      <span>{{SERIES}}</span>
      <span class="lesson">第 {{LESSON}} 课</span>
      <span>{{CATEGORY}}</span>
    </div>
  </div>
  <div class="main">
    <h1>{{TITLE}}</h1>
    <div class="rule"></div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>
  <div class="bottom">
    <span>{{FOOTER}}</span>
    <span class="no">{{LESSON}} / 30</span>
  </div>
</body>
</html>
