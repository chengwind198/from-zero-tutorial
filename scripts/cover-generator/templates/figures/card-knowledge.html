<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:{{PALETTE_BG}}}
/* 卡片高 100% 填满可用区域（渲染时布局视口小于窗口，内容一律通过裁剪防溢出） */
body{font-family:"Microsoft YaHei",sans-serif;background:{{PALETTE_BG}};color:{{PALETTE_INK}};display:flex;align-items:flex-start;justify-content:center;padding:48px}
.card{width:100%;height:100%;min-height:0;border:1px solid {{PALETTE_SUB}};border-radius:16px;padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(128,128,128,.08);overflow:hidden}
.tag{color:{{PALETTE_ACCENT}};font-size:15px;letter-spacing:2px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.3;margin:12px 0;font-weight:800}
.body{font-size:clamp(15px,2.2vw,22px);color:{{PALETTE_SUB}};line-height:1.65;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.foot{font-size:14px;color:{{PALETTE_SUB}}}
</style></head><body>
<div class="card">
  <div class="tag">{{TAG}}</div>
  <div>
    <h1>{{TITLE}}</h1>
    <div class="body">{{BODY}}</div>
  </div>
  <div class="foot">{{FOOT}}</div>
</div>
</body></html>
