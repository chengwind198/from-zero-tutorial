<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:{{PALETTE_BG}}}
/* 卡片高 100% 填满可用区域（渲染时布局视口小于窗口，内容一律通过行均分+裁剪防溢出） */
body{font-family:"Microsoft YaHei",sans-serif;background:{{PALETTE_BG}};color:{{PALETTE_INK}};display:flex;align-items:flex-start;justify-content:center;padding:40px}
.wrap{width:100%;height:100%;min-height:0;border:1px solid {{PALETTE_SUB}};border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:10px;background:rgba(128,128,128,.08);overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;flex:none}
.head h1{font-size:clamp(19px,2.6vw,26px);font-weight:800;line-height:1.25}
.tag{color:{{PALETTE_ACCENT}};font-size:12px;letter-spacing:2px;flex:none}
.table{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.row{display:flex;gap:8px;flex:1;min-height:0;overflow:hidden}
.cell{flex:1;min-width:0;padding:6px 10px;border-radius:10px;background:rgba(128,128,128,.06);border:1px solid {{PALETTE_SUB}};overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.cell .k{flex:none;font-size:11px;color:{{PALETTE_ACCENT}};letter-spacing:1px;margin-bottom:3px;line-height:1.2}
.cell .v{flex:none;font-size:clamp(12.5px,1.6vw,15px);font-weight:700;line-height:1.2}
.cell .d{flex:none;font-size:clamp(10px,1.3vw,11.5px);color:{{PALETTE_SUB}};margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{font-size:13px;color:{{PALETTE_SUB}}}
</style></head><body>
<div class="wrap">
  <div class="head"><h1>{{TITLE}}</h1><span class="tag">{{TAG}}</span></div>
  <div class="table">
    <div class="row"><div class="cell"><div class="k">{{K1}}</div><div class="v">{{V1}}</div><div class="d">{{D1}}</div></div><div class="cell"><div class="k">{{K2}}</div><div class="v">{{V2}}</div><div class="d">{{D2}}</div></div></div>
    <div class="row"><div class="cell"><div class="k">{{K3}}</div><div class="v">{{V3}}</div><div class="d">{{D3}}</div></div><div class="cell"><div class="k">{{K4}}</div><div class="v">{{V4}}</div><div class="d">{{D4}}</div></div></div>
    <div class="row"><div class="cell"><div class="k">{{K5}}</div><div class="v">{{V5}}</div><div class="d">{{D5}}</div></div><div class="cell"><div class="k">{{K6}}</div><div class="v">{{V6}}</div><div class="d">{{D6}}</div></div></div>
    <div class="row"><div class="cell"><div class="k">{{K7}}</div><div class="v">{{V7}}</div><div class="d">{{D7}}</div></div><div class="cell"><div class="k">{{K8}}</div><div class="v">{{V8}}</div><div class="d">{{D8}}</div></div></div>
  </div>
  <div class="foot">{{FOOT}}</div>
</div>
</body></html>
