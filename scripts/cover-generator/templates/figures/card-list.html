<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
html{background:{{PALETTE_BG}}}
/* 卡片高 100% 填满可用区域（渲染时布局视口小于窗口，内容一律通过行均分+裁剪防溢出） */
body{font-family:"Microsoft YaHei",sans-serif;background:{{PALETTE_BG}};color:{{PALETTE_INK}};display:flex;align-items:flex-start;justify-content:center;padding:40px}
.wrap{width:100%;height:100%;min-height:0;border:1px solid {{PALETTE_SUB}};border-radius:16px;padding:28px 36px;display:flex;flex-direction:column;gap:14px;background:rgba(128,128,128,.08);overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center}
.head h1{font-size:clamp(20px,2.8vw,28px);font-weight:800;line-height:1.25}
.tag{color:{{PALETTE_ACCENT}};font-size:14px;letter-spacing:2px}
.list{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:8px 14px;align-content:stretch}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid {{PALETTE_SUB}};border-radius:10px;background:rgba(128,128,128,.06);overflow:hidden;min-height:0}
.item .idx{width:26px;height:26px;border-radius:8px;background:{{PALETTE_ACCENT}};color:{{PALETTE_BG}};font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.item .text{font-size:clamp(13px,1.7vw,16px);font-weight:600;line-height:1.2}
.item .sub{font-size:clamp(10.5px,1.45vw,12px);color:{{PALETTE_SUB}};margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{font-size:13px;color:{{PALETTE_SUB}}}
</style></head><body>
<div class="wrap">
  <div class="head"><h1>{{TITLE}}</h1><span class="tag">{{TAG}}</span></div>
  <div class="list">
    <div class="item"><div class="idx">1</div><div><div class="text">{{ITEM1}}</div><div class="sub">{{S1}}</div></div></div>
    <div class="item"><div class="idx">2</div><div><div class="text">{{ITEM2}}</div><div class="sub">{{S2}}</div></div></div>
    <div class="item"><div class="idx">3</div><div><div class="text">{{ITEM3}}</div><div class="sub">{{S3}}</div></div></div>
    <div class="item"><div class="idx">4</div><div><div class="text">{{ITEM4}}</div><div class="sub">{{S4}}</div></div></div>
    <div class="item"><div class="idx">5</div><div><div class="text">{{ITEM5}}</div><div class="sub">{{S5}}</div></div></div>
    <div class="item"><div class="idx">6</div><div><div class="text">{{ITEM6}}</div><div class="sub">{{S6}}</div></div></div>
    <div class="item"><div class="idx">7</div><div><div class="text">{{ITEM7}}</div><div class="sub">{{S7}}</div></div></div>
    <div class="item"><div class="idx">8</div><div><div class="text">{{ITEM8}}</div><div class="sub">{{S8}}</div></div></div>
    <div class="item"><div class="idx">9</div><div><div class="text">{{ITEM9}}</div><div class="sub">{{S9}}</div></div></div>
  </div>
  <div class="foot">{{FOOT}}</div>
</div>
</body></html>
